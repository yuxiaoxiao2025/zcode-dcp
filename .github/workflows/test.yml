name: test

on:
  push:
  pull_request:

jobs:
  test:
    # The integration tests in test/mcp.test.mjs use Windows process helpers
    # (cmd.exe / taskkill) for daemon cleanup, so the suite requires Windows.
    # The plugin runtime code itself is pure cross-platform Node.
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run test suite (zero dependencies, no install step)
        shell: bash
        run: node --test test/*.test.mjs
